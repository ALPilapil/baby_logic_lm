defaults:
  - schema
  - _self_

per_device_train_batch_size: 8
per_device_eval_batch_size: 8
learning_rate: 2.5e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
adam_beta1: 0.9
adam_beta2: 0.999
weight_decay: 0.01
eval_strategy: steps
eval_steps: 500
logging_steps: 500
save_steps: 5000
save_total_limit: 10
report_to: wandb
