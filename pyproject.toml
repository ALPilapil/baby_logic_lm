[project]
name = "baby-logic-lm"
version = "0.1.0"
description = "Pythia-160M trained from scratch on CHILDES, with optional Dyck/POS pre-training and NSP/NUP post-training, evaluated on Crain & Nakayama and BLiMP."
authors = [{name = "Aaron Pilapil", email = "aarpila@gmail.com"}]
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "baby_logic_lm", from = "src"}]

[tool.poetry.dependencies]

absl-py = "2.3.1"
accelerate = "1.10.1"
aiohappyeyeballs = "2.6.1"
aiohttp = "3.12.15"
aiosignal = "1.4.0"
annotated-types = "0.7.0"
async-timeout = "5.0.1"
attrs = "25.3.0"
certifi = "2025.8.3"
charset-normalizer = "3.4.3"
click = "8.2.1"
datasets = "4.0.0"
dill = "0.3.8"
evaluate = "0.4.5"
filelock = "3.19.1"
frozenlist = "1.7.0"
fsspec = "2025.3.0"
gitdb = "4.0.12"
GitPython = "3.1.45"
hf-xet = "1.1.10"
huggingface-hub = "0.34.4"
hydra-core = "1.3.2"
idna = "3.10"
Jinja2 = "3.1.6"
joblib = "1.5.2"
MarkupSafe = "3.0.2"
mpmath = "1.3.0"
multidict = "6.6.4"
multiprocess = "0.70.16"
networkx = "3.4.2"
nltk = "3.9.1"
numpy = "2.2.6"

# CUDA runtime libs pulled in by torch on Linux training boxes; no macOS wheels exist.
nvidia-cublas-cu12 = {version = "12.8.4.1", markers = "sys_platform == 'linux'"}
nvidia-cuda-cupti-cu12 = {version = "12.8.90", markers = "sys_platform == 'linux'"}
nvidia-cuda-nvrtc-cu12 = {version = "12.8.93", markers = "sys_platform == 'linux'"}
nvidia-cuda-runtime-cu12 = {version = "12.8.90", markers = "sys_platform == 'linux'"}
nvidia-cudnn-cu12 = {version = "9.10.2.21", markers = "sys_platform == 'linux'"}
nvidia-cufft-cu12 = {version = "11.3.3.83", markers = "sys_platform == 'linux'"}
nvidia-cufile-cu12 = {version = "1.13.1.3", markers = "sys_platform == 'linux'"}
nvidia-curand-cu12 = {version = "10.3.9.90", markers = "sys_platform == 'linux'"}
nvidia-cusolver-cu12 = {version = "11.7.3.90", markers = "sys_platform == 'linux'"}
nvidia-cusparse-cu12 = {version = "12.5.8.93", markers = "sys_platform == 'linux'"}
nvidia-cusparselt-cu12 = {version = "0.7.1", markers = "sys_platform == 'linux'"}
nvidia-nccl-cu12 = {version = "2.27.3", markers = "sys_platform == 'linux'"}
nvidia-nvjitlink-cu12 = {version = "12.8.93", markers = "sys_platform == 'linux'"}
nvidia-nvtx-cu12 = {version = "12.8.90", markers = "sys_platform == 'linux'"}

omegaconf = "2.3.0"
packaging = "25.0"
pandas = "2.3.2"
platformdirs = "4.4.0"
propcache = "0.3.2"
protobuf = "6.32.1"
psutil = "7.0.0"
pyarrow = "21.0.0"
pydantic = "2.11.7"
pydantic-core = "2.33.2"
python-dateutil = "2.9.0.post0"
pytz = "2025.2"
PyYAML = "6.0.2"
regex = "2025.9.1"
requests = "2.32.5"
rouge_score = "0.1.2"
safetensors = "0.6.2"
sentry-sdk = "2.37.1"
six = "1.17.0"
smmap = "5.0.2"
sympy = "1.14.0"
tokenizers = "0.22.0"
torch = "2.8.0"
tqdm = "4.67.1"
transformers = "4.56.1"

# Torch's GPU kernel compiler on Linux; no macOS wheels exist.
triton = {version = "3.4.0", markers = "sys_platform == 'linux'"}

typing-inspection = "0.4.1"
typing_extensions = "4.15.0"
tzdata = "2025.2"
urllib3 = "2.5.0"
wandb = "0.30.0"
xxhash = "3.5.0"
yarl = "1.20.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
